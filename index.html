<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Personagens de Rick and Morty</title>

<body>

    <header class="cabecalho-principal">
        <h1 class="titulo-principal">Personagens de Rick and Morty</h1>
        
        <!-- nav para o bloco de navegação/filtros -->
        <nav class="navegacao-filtros" aria-label="Filtros de status dos personagens">
            <ul class="lista-filtros">
                <!-- aria-pressed indica ao leitor de tela qual botão está ativo -->
                <!-- aria-controls indica qual área do site este botão altera -->
                <li class="item-filtro">
                    <button type="button" id="filtro-todos" class="btn-filtro js-btn-filtro" data-status="" aria-pressed="true" aria-controls="lista-personagens">
                        Todos
                    </button>
                </li>
                <li class="item-filtro">
                    <button type="button" id="filtro-vivos"  class="btn-filtro js-btn-filtro" data-status="alive" aria-pressed="false" aria-controls="lista-personagens">
                        Vivos
                    </button>
                </li>
                <li class="item-filtro">
                    <button type="button" id="filtro-mortos" class="btn-filtro js-btn-filtro" data-status="dead" aria-pressed="false" aria-controls="lista-personagens">
                        Mortos
                    </button>
                </li>
                <li class="item-filtro">
                    <button type="button" id="filtro-desconhecidos" class="btn-filtro js-btn-filtro" data-status="unknown" aria-pressed="false" aria-controls="lista-personagens">
                        Desconhecidos
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <!-- 
      aria-live="polite" faz com que leitores de tela anunciem 
      quando novos cards forem injetados aqui pelo JavaScript.
      aria-busy="false" pode ser alterado para "true" pelo JS enquanto a API carrega.
    -->
    <main id="lista-personagens" class="conteudo-principal js-container-personagens" aria-live="polite" aria-busy="false">
